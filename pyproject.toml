[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-execution-intelligence"
version = "0.1.0"
description = "An AI execution intelligence platform for prompt analysis, model selection, execution tracking, cost estimation, and quality evaluation."
requires-python = ">=3.14"
dependencies = [
    "ollama>=0.6.3",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "SQLAlchemy>=2.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]